<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>REDDER'S QUEST — WORLD 1</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #101018;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }
  #wrap { text-align: center; }
  canvas {
    display: block;
    background: #7ec8e3;
    border: 3px solid #7c3aed;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(124,58,237,0.3);
  }
  #hint {
    color: #9a9aa8;
    text-align: center;
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: 0.03em;
  }

  .lobby-link {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 20;
    color: #fff;
    background: rgba(20, 16, 32, 0.82);
    border: 1px solid #7c3aed;
    border-radius: 999px;
    padding: 9px 14px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    backdrop-filter: blur(8px);
  }
  .lobby-link:hover { background: #7c3aed; }
</style>
</head>
<body>
<a class="lobby-link" href="index.html">← World Lobby</a>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <audio id="bgm" src="Killer.mp3" loop preload="auto"></audio>
  <div id="hint">Move: A/D or ←/→ &nbsp;|&nbsp; Jump: W / Space / ↑ (stomp enemies from above!) &nbsp;|&nbsp; Enter: start / advance &nbsp;|&nbsp; R: restart &nbsp;|&nbsp; M: mute music &nbsp;|&nbsp; L / Esc: lobby</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VW = canvas.width, VH = canvas.height;
const TILE = 40;
const GRAVITY = 0.85;
const MOVE_SPEED = 4.2;
const JUMP_VELOCITY = -15.5;
const GROUND_Y = VH - 80;

// Palette from the character sheet
const C_BLACK = '#111111';
const C_GREY = '#b6b6b6';
const C_RED = '#f31900';
const C_WHITE = '#fcfcfc';
const C_PURPLE = '#7c3aed';

const WORLD1_COMPLETE_KEY = 'reddersQuestWorld1Complete';
const WORLD2_UNLOCK_KEY = 'reddersQuestWorld2Unlocked';
const WORLD1_BEST_SCORE_KEY = 'reddersQuestWorld1BestScore';

function unlockWorld2(finalScore) {
  localStorage.setItem(WORLD1_COMPLETE_KEY, 'true');
  localStorage.setItem(WORLD2_UNLOCK_KEY, 'true');
  const oldBest = Number(localStorage.getItem(WORLD1_BEST_SCORE_KEY) || 0);
  if (finalScore > oldBest) localStorage.setItem(WORLD1_BEST_SCORE_KEY, String(finalScore));
}

const bgm = document.getElementById('bgm');
bgm.volume = 0.5;
let musicStarted = false;
let musicMuted = false;

function ensureMusicPlaying() {
  if (!musicStarted) {
    musicStarted = true;
    bgm.play().catch(() => { /* will retry on next interaction */ });
  } else if (bgm.paused && !musicMuted) {
    bgm.play().catch(() => {});
  }
}

function toggleMute() {
  musicMuted = !musicMuted;
  bgm.muted = musicMuted;
}

function keysDown() { return keys; }
let keys = {};
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === 'enter') { ensureMusicPlaying(); handleEnter(); }
  if (k === 'r') { ensureMusicPlaying(); handleRestart(); }
  if (k === 'm') toggleMute();
  if (k === 'l' || k === 'escape') window.location.href = 'index.html';
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function rectsCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------------------------------------------------------
// CHARACTER SPRITE (drawn to match the reference sheet)
// ---------------------------------------------------------
function drawRedder(c, x, y, w, h, facing, walkPhase, hurt) {
  c.save();
  c.translate(x + w / 2, y + h / 2);
  c.scale(facing, 1);
  c.translate(-w / 2, -h / 2);

  const bob = Math.sin(walkPhase) * 2;

  // feet
  c.fillStyle = C_GREY;
  c.beginPath();
  c.ellipse(w * 0.28, h - 4, 8, 5, 0, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.ellipse(w * 0.72, h - 4, 8, 5, 0, 0, Math.PI * 2);
  c.fill();

  // body (red shirt, trapezoid)
  c.fillStyle = hurt ? '#ffffff' : C_RED;
  c.beginPath();
  c.moveTo(w * 0.30, h * 0.55);
  c.lineTo(w * 0.70, h * 0.55);
  c.lineTo(w * 0.62, h - 6);
  c.lineTo(w * 0.38, h - 6);
  c.closePath();
  c.fill();
  c.strokeStyle = C_BLACK;
  c.lineWidth = 1.5;
  c.stroke();

  // hands
  c.fillStyle = C_GREY;
  c.beginPath();
  c.ellipse(w * 0.14, h * 0.62 + bob * 0.3, 7, 6, 0, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.ellipse(w * 0.86, h * 0.62 - bob * 0.3, 7, 6, 0, 0, Math.PI * 2);
  c.fill();

  // head
  c.fillStyle = C_WHITE;
  c.beginPath();
  c.ellipse(w * 0.5, h * 0.32, w * 0.34, h * 0.30, 0, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = C_BLACK;
  c.lineWidth = 1.5;
  c.stroke();

  // spiky grey hair
  c.fillStyle = C_GREY;
  c.beginPath();
  c.moveTo(w * 0.18, h * 0.22);
  c.lineTo(w * 0.22, h * -0.05);
  c.lineTo(w * 0.32, h * 0.12);
  c.lineTo(w * 0.40, h * -0.12);
  c.lineTo(w * 0.50, h * 0.08);
  c.lineTo(w * 0.60, h * -0.10);
  c.lineTo(w * 0.68, h * 0.10);
  c.lineTo(w * 0.80, h * -0.02);
  c.lineTo(w * 0.82, h * 0.20);
  c.closePath();
  c.fill();
  c.stroke();

  // face: closed happy eyes with a red dot, small smile
  c.strokeStyle = C_BLACK;
  c.lineWidth = 1.4;
  c.beginPath();
  c.arc(w * 0.40, h * 0.30, 4, Math.PI, 0);
  c.stroke();
  c.beginPath();
  c.arc(w * 0.60, h * 0.30, 4, Math.PI, 0);
  c.stroke();
  c.fillStyle = C_RED;
  c.beginPath();
  c.arc(w * 0.40, h * 0.33, 1.6, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.arc(w * 0.60, h * 0.33, 1.6, 0, Math.PI * 2);
  c.fill();

  c.beginPath();
  c.arc(w * 0.5, h * 0.38, 6, 0.15 * Math.PI, 0.85 * Math.PI);
  c.stroke();

  c.restore();
}

// ---------------------------------------------------------
// ENTITIES
// ---------------------------------------------------------
class Player {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.w = 34; this.h = 44;
    this.vx = 0; this.vy = 0;
    this.onGround = false;
    this.facing = 1;
    this.walkPhase = 0;
    this.lives = 3;
    this.score = 0;
    this.invuln = 0;
    this.dead = false;
  }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  update(level) {
    const left = keys['a'] || keys['arrowleft'];
    const right = keys['d'] || keys['arrowright'];
    const jumpKey = keys['w'] || keys[' '] || keys['arrowup'];

    if (left) { this.vx = -MOVE_SPEED; this.facing = -1; }
    else if (right) { this.vx = MOVE_SPEED; this.facing = 1; }
    else { this.vx = 0; }

    if (jumpKey && this.onGround) {
      this.vy = JUMP_VELOCITY;
      this.onGround = false;
    }

    if (this.vx !== 0) this.walkPhase += 0.25;

    this.vy += GRAVITY;
    if (this.vy > 18) this.vy = 18;

    // horizontal move + collide
    this.x += this.vx;
    this.resolveCollisions(level, 'x');
    // vertical move + collide
    this.y += this.vy;
    this.onGround = false;
    this.resolveCollisions(level, 'y');

    if (this.x < 0) this.x = 0;
    if (this.invuln > 0) this.invuln--;

    if (this.y > VH + 200) this.die();
  }
  resolveCollisions(level, axis) {
    const r = this.rect();
    for (const p of level.platforms) {
      if (rectsCollide(r, p)) {
        if (axis === 'x') {
          if (this.vx > 0) this.x = p.x - this.w;
          else if (this.vx < 0) this.x = p.x + p.w;
          this.vx = 0;
        } else {
          if (this.vy > 0) {
            this.y = p.y - this.h;
            this.vy = 0;
            this.onGround = true;
          } else if (this.vy < 0) {
            this.y = p.y + p.h;
            this.vy = 0;
          }
        }
        r.x = this.x; r.y = this.y;
      }
    }
  }
  hurt() {
    if (this.invuln > 0) return;
    this.lives--;
    this.invuln = 90;
    this.vy = -10;
    this.vx = this.facing * -4;
    if (this.lives <= 0) this.die();
  }
  die() {
    this.dead = true;
  }
  draw(c) {
    if (this.invuln > 0 && Math.floor(this.invuln / 4) % 2 === 0) return;
    drawRedder(c, this.x, this.y, this.w, this.h, this.facing, this.walkPhase, false);
  }
}

class Enemy {
  constructor(x, y, rangeMin, rangeMax) {
    this.x = x; this.y = y;
    this.w = 32; this.h = 32;
    this.vx = 1.6;
    this.rangeMin = rangeMin;
    this.rangeMax = rangeMax;
    this.alive = true;
    this.squish = 0;
  }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  update() {
    if (!this.alive) { if (this.squish > 0) this.squish--; return; }
    this.x += this.vx;
    if (this.x < this.rangeMin || this.x + this.w > this.rangeMax) this.vx *= -1;
  }
  draw(c) {
    if (!this.alive) return;
    c.fillStyle = '#3a3a46';
    c.beginPath();
    c.ellipse(this.x + this.w / 2, this.y + this.h / 2, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = C_PURPLE;
    c.beginPath();
    c.arc(this.x + this.w * 0.35, this.y + this.h * 0.4, 3, 0, Math.PI * 2);
    c.fill();
    c.beginPath();
    c.arc(this.x + this.w * 0.65, this.y + this.h * 0.4, 3, 0, Math.PI * 2);
    c.fill();
  }
}

class Coin {
  constructor(x, y) { this.x = x; this.y = y; this.collected = false; this.spin = Math.random() * 10; }
  rect() { return { x: this.x, y: this.y, w: 20, h: 20 }; }
  update() { this.spin += 0.15; }
  draw(c) {
    if (this.collected) return;
    const scaleX = Math.abs(Math.cos(this.spin));
    c.save();
    c.translate(this.x + 10, this.y + 10);
    c.scale(scaleX, 1);
    c.fillStyle = '#ffd23f';
    c.beginPath();
    c.arc(0, 0, 9, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#b8860b';
    c.lineWidth = 2;
    c.stroke();
    c.restore();
  }
}

// ---------------------------------------------------------
// LEVEL DATA
// ---------------------------------------------------------
function groundRun(startX, endX) {
  return { x: startX, y: GROUND_Y, w: endX - startX, h: VH - GROUND_Y };
}
function platform(x, y, w) {
  return { x, y, w, h: 20 };
}

function buildLevel1() {
  const platforms = [
    groundRun(0, 480),
    groundRun(560, 900),
    groundRun(980, 1500),
    platform(700, GROUND_Y - 90, 100),
    groundRun(1580, 2400),
    platform(1900, GROUND_Y - 110, 90),
  ];
  const coins = [
    new Coin(250, GROUND_Y - 40), new Coin(300, GROUND_Y - 40), new Coin(350, GROUND_Y - 40),
    new Coin(730, GROUND_Y - 130), new Coin(1050, GROUND_Y - 40), new Coin(1100, GROUND_Y - 40),
    new Coin(1930, GROUND_Y - 150), new Coin(2100, GROUND_Y - 40), new Coin(2150, GROUND_Y - 40),
  ];
  const enemies = [
    new Enemy(650, GROUND_Y - 32, 560, 900),
    new Enemy(1200, GROUND_Y - 32, 980, 1500),
  ];
  return { platforms, coins, enemies, width: 2400, goalX: 2320, spawn: { x: 60, y: GROUND_Y - 100 } };
}

function buildLevel2() {
  const platforms = [
    groundRun(0, 300),
    platform(360, GROUND_Y - 60, 90),
    platform(500, GROUND_Y - 130, 90),
    platform(650, GROUND_Y - 190, 90),
    groundRun(800, 1100),
    platform(1160, GROUND_Y - 80, 80),
    platform(1300, GROUND_Y - 150, 80),
    platform(1440, GROUND_Y - 80, 80),
    groundRun(1560, 1900),
    platform(1950, GROUND_Y - 100, 100),
    platform(2120, GROUND_Y - 170, 100),
    groundRun(2280, 2900),
  ];
  const coins = [
    new Coin(390, GROUND_Y - 100), new Coin(530, GROUND_Y - 170), new Coin(680, GROUND_Y - 230),
    new Coin(850, GROUND_Y - 40), new Coin(900, GROUND_Y - 40), new Coin(950, GROUND_Y - 40),
    new Coin(1190, GROUND_Y - 120), new Coin(1330, GROUND_Y - 190), new Coin(1470, GROUND_Y - 120),
    new Coin(1980, GROUND_Y - 140), new Coin(2150, GROUND_Y - 210),
  ];
  const enemies = [
    new Enemy(820, GROUND_Y - 32, 800, 1100),
    new Enemy(1600, GROUND_Y - 32, 1560, 1900),
    new Enemy(2350, GROUND_Y - 32, 2280, 2900),
  ];
  return { platforms, coins, enemies, width: 2900, goalX: 2820, spawn: { x: 60, y: GROUND_Y - 100 } };
}

function buildLevel3() {
  const platforms = [
    groundRun(0, 260),
    platform(320, GROUND_Y - 70, 70),
    platform(450, GROUND_Y - 140, 70),
    platform(580, GROUND_Y - 210, 70),
    platform(720, GROUND_Y - 140, 70),
    platform(860, GROUND_Y - 70, 70),
    groundRun(950, 1150),
    platform(1220, GROUND_Y - 90, 70),
    platform(1350, GROUND_Y - 160, 70),
    platform(1480, GROUND_Y - 230, 70),
    platform(1610, GROUND_Y - 160, 70),
    platform(1740, GROUND_Y - 90, 70),
    groundRun(1830, 2050),
    platform(2120, GROUND_Y - 100, 90),
    platform(2280, GROUND_Y - 180, 90),
    platform(2440, GROUND_Y - 100, 90),
    groundRun(2600, 3300),
  ];
  const coins = [
    new Coin(350, GROUND_Y - 110), new Coin(480, GROUND_Y - 180), new Coin(610, GROUND_Y - 250),
    new Coin(750, GROUND_Y - 180), new Coin(890, GROUND_Y - 110),
    new Coin(1250, GROUND_Y - 130), new Coin(1380, GROUND_Y - 200), new Coin(1510, GROUND_Y - 270),
    new Coin(1640, GROUND_Y - 200), new Coin(1770, GROUND_Y - 130),
    new Coin(2150, GROUND_Y - 140), new Coin(2310, GROUND_Y - 220), new Coin(2470, GROUND_Y - 140),
  ];
  const enemies = [
    new Enemy(980, GROUND_Y - 32, 950, 1150),
    new Enemy(1870, GROUND_Y - 32, 1830, 2050),
    new Enemy(2650, GROUND_Y - 32, 2600, 2900),
    new Enemy(2950, GROUND_Y - 32, 2900, 3300),
  ];
  return { platforms, coins, enemies, width: 3300, goalX: 3220, spawn: { x: 60, y: GROUND_Y - 100 } };
}

const LEVELS = [buildLevel1, buildLevel2, buildLevel3];

// ---------------------------------------------------------
// GAME STATE
// ---------------------------------------------------------
let state = 'menu'; // menu | playing | levelComplete | gameOver | gameWin
let levelIndex = 0;
let level, player, camX, totalScore, flagX;
let flagRaised = false;
let transitionTimer = 0;

function loadLevel(i) {
  level = LEVELS[i]();
  player = new Player(level.spawn.x, level.spawn.y);
  player.score = totalScore || 0;
  camX = 0;
  flagRaised = false;
}

function startGame() {
  totalScore = 0;
  levelIndex = 0;
  loadLevel(levelIndex);
  state = 'playing';
}

function handleEnter() {
  if (state === 'menu') startGame();
  else if (state === 'levelComplete') {
    levelIndex++;
    if (levelIndex >= LEVELS.length) {
      unlockWorld2(player.score);
      state = 'gameWin';
    } else {
      totalScore = player.score;
      loadLevel(levelIndex);
      state = 'playing';
    }
  } else if (state === 'gameWin') {
    window.location.href = 'world2.html';
  } else if (state === 'gameOver') {
    state = 'menu';
  }
}
function handleRestart() {
  if (state !== 'menu') {
    totalScore = 0;
    levelIndex = 0;
    loadLevel(0);
    state = 'playing';
  }
}

// ---------------------------------------------------------
// UPDATE
// ---------------------------------------------------------
function update() {
  if (state !== 'playing') return;

  player.update(level);

  level.enemies.forEach(en => en.update());
  level.coins.forEach(co => co.update());

  // coin pickup
  for (const co of level.coins) {
    if (!co.collected && rectsCollide(player.rect(), co.rect())) {
      co.collected = true;
      player.score += 10;
    }
  }

  // enemy collision
  for (const en of level.enemies) {
    if (!en.alive) continue;
    if (rectsCollide(player.rect(), en.rect())) {
      const playerBottom = player.y + player.h;
      const enemyTop = en.y;
      if (player.vy > 0 && playerBottom - en.h * 0.5 < enemyTop + 14) {
        // stomp
        en.alive = false;
        en.squish = 10;
        player.vy = -10;
        player.score += 25;
      } else {
        player.hurt();
      }
    }
  }

  // goal flag
  if (player.x + player.w >= level.goalX && !flagRaised) {
    flagRaised = true;
    transitionTimer = 60;
  }
  if (flagRaised) {
    transitionTimer--;
    if (transitionTimer <= 0) {
      state = 'levelComplete';
    }
  }

  if (player.dead) {
    state = 'gameOver';
  }

  // camera
  const targetCam = player.x - VW / 2 + player.w / 2;
  camX = Math.max(0, Math.min(level.width - VW, targetCam));
}

// ---------------------------------------------------------
// DRAW
// ---------------------------------------------------------
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, VH);
  grad.addColorStop(0, '#8ecae6');
  grad.addColorStop(1, '#bde0fe');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VW, VH);

  // parallax hills
  ctx.fillStyle = 'rgba(124,58,237,0.15)';
  for (let i = 0; i < 8; i++) {
    const hx = (i * 300 - camX * 0.3) % (VW + 300) - 150;
    ctx.beginPath();
    ctx.ellipse(hx, VH - 60, 160, 90, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // distant clouds
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (let i = 0; i < 6; i++) {
    const cx = (i * 260 - camX * 0.15) % (VW + 260) - 130;
    const cy = 60 + (i % 3) * 30;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 30, 16, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + 24, cy + 4, 22, 12, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlatform(c, p) {
  c.fillStyle = '#5b3a29';
  c.fillRect(p.x - camX, p.y, p.w, p.h);
  c.fillStyle = '#6fae4e';
  c.fillRect(p.x - camX, p.y, p.w, 8);
}

function drawFlag(c) {
  const fx = level.goalX - camX;
  c.fillStyle = '#888';
  c.fillRect(fx, GROUND_Y - 220, 6, 220);
  const waveOffset = flagRaised ? -160 : 0;
  c.fillStyle = C_PURPLE;
  c.beginPath();
  c.moveTo(fx + 6, GROUND_Y - 210 + waveOffset);
  c.lineTo(fx + 60, GROUND_Y - 195 + waveOffset);
  c.lineTo(fx + 6, GROUND_Y - 180 + waveOffset);
  c.closePath();
  c.fill();
}

function drawHUD() {
  ctx.fillStyle = '#1e1e2a';
  ctx.font = 'bold 16px "Segoe UI"';
  ctx.fillText(`Score: ${player.score}`, 16, 28);
  ctx.fillText(`Lives: ${player.lives}`, 16, 50);
  ctx.fillText(`Level ${levelIndex + 1} / ${LEVELS.length}`, VW - 150, 28);
  ctx.font = '12px "Segoe UI"';
  ctx.fillText(musicMuted ? 'Music: off (M)' : 'Music: on (M)', VW - 150, 48);
}

function drawMenu() {
  drawBackground();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3a1f6b';
  ctx.font = 'bold 42px "Segoe UI"';
  ctx.fillText("REDDER'S QUEST", VW / 2, 130);

  drawRedder(ctx, VW / 2 - 40, 160, 80, 100, 1, performance.now() / 150, false);

  ctx.fillStyle = '#1e1e2a';
  ctx.font = '16px "Segoe UI"';
  ctx.fillText('Run, jump, and stomp your way across 3 hand-built levels.', VW / 2, 320);
  ctx.font = '13px "Segoe UI"';
  ctx.fillText('A/D or ←/→ to move  ·  W / Space / ↑ to jump  ·  jump on enemies to defeat them', VW / 2, 348);

  ctx.fillStyle = C_PURPLE;
  ctx.font = 'bold 18px "Segoe UI"';
  ctx.fillText('PRESS ENTER TO START', VW / 2, 410);
  ctx.textAlign = 'left';
}

function drawLevelComplete() {
  ctx.fillStyle = 'rgba(10,10,20,0.55)';
  ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 32px "Segoe UI"';
  ctx.fillText(`LEVEL ${levelIndex + 1} COMPLETE!`, VW / 2, VH / 2 - 20);
  ctx.font = '16px "Segoe UI"';
  ctx.fillText(`Score so far: ${player.score}`, VW / 2, VH / 2 + 14);
  ctx.fillStyle = C_PURPLE;
  ctx.font = 'bold 16px "Segoe UI"';
  ctx.fillText('PRESS ENTER TO CONTINUE', VW / 2, VH / 2 + 50);
  ctx.textAlign = 'left';
}

function drawGameOver() {
  drawBackground();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#7a1e1e';
  ctx.font = 'bold 36px "Segoe UI"';
  ctx.fillText('GAME OVER', VW / 2, VH / 2 - 20);
  ctx.fillStyle = '#1e1e2a';
  ctx.font = '16px "Segoe UI"';
  ctx.fillText(`Final Score: ${player.score}`, VW / 2, VH / 2 + 14);
  ctx.fillStyle = C_PURPLE;
  ctx.font = 'bold 15px "Segoe UI"';
  ctx.fillText('PRESS R TO TRY AGAIN  ·  ENTER FOR MENU', VW / 2, VH / 2 + 50);
  ctx.textAlign = 'left';
}

function drawGameWin() {
  drawBackground();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3a1f6b';
  ctx.font = 'bold 36px "Segoe UI"';
  ctx.fillText('WORLD 1 COMPLETE!', VW / 2, VH / 2 - 52);
  drawRedder(ctx, VW / 2 - 40, VH / 2 - 20, 80, 100, 1, performance.now() / 150, false);
  ctx.fillStyle = '#1e1e2a';
  ctx.font = '16px "Segoe UI"';
  ctx.fillText(`Final Score: ${player.score}`, VW / 2, VH / 2 + 100);
  ctx.fillStyle = '#3a1f6b';
  ctx.font = 'bold 18px "Segoe UI"';
  ctx.fillText('THE UNDERWORLD HAS BEEN UNLOCKED', VW / 2, VH / 2 + 126);
  ctx.fillStyle = C_PURPLE;
  ctx.font = 'bold 15px "Segoe UI"';
  ctx.fillText('PRESS ENTER FOR WORLD 2  ·  R TO REPLAY  ·  L FOR LOBBY', VW / 2, VH / 2 + 158);
  ctx.textAlign = 'left';
}

function draw() {
  ctx.clearRect(0, 0, VW, VH);

  if (state === 'menu') { drawMenu(); return; }
  if (state === 'gameOver') { drawGameOver(); return; }
  if (state === 'gameWin') { drawGameWin(); return; }

  drawBackground();
  for (const p of level.platforms) drawPlatform(ctx, p);
  level.coins.forEach(co => {
    ctx.save();
    ctx.translate(-camX, 0);
    co.draw(ctx);
    ctx.restore();
  });
  ctx.save();
  ctx.translate(-camX, 0);
  level.enemies.forEach(en => en.draw(ctx));
  ctx.restore();

  drawFlag(ctx);

  ctx.save();
  ctx.translate(-camX, 0);
  player.draw(ctx);
  ctx.restore();

  drawHUD();

  if (state === 'levelComplete') drawLevelComplete();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
