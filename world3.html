<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REDDER'S QUEST: TINFOIL SHOWDOWN</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: #07080b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }
  #wrap { text-align: center; width: min(100%, 1000px); }
  canvas {
    display: block;
    width: min(960px, calc(100vw - 28px));
    height: auto;
    margin: 0 auto;
    background: #17191f;
    border: 3px solid #c9c9c9;
    border-radius: 5px;
    box-shadow: 0 0 44px rgba(118,255,0,.22), 0 0 90px rgba(255,229,0,.08);
  }
  #hint {
    color: #aeb0b8;
    font-size: 12px;
    margin-top: 8px;
    letter-spacing: .025em;
  }
  .lobby-link {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 20;
    color: #fff;
    background: rgba(10, 11, 14, .86);
    border: 1px solid #d5d5d5;
    border-radius: 999px;
    padding: 9px 14px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .04em;
    backdrop-filter: blur(8px);
  }
  .lobby-link:hover { color: #111; background: #d7d7d7; }
</style>
</head>
<body>
<a class="lobby-link" href="index.html">← World Lobby</a>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hint">Move: A/D or ←/→ &nbsp;|&nbsp; Jump / Double Jump: W / Space / ↑ &nbsp;|&nbsp; Attack: J &nbsp;|&nbsp; R: restart &nbsp;|&nbsp; L / Esc: lobby</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VW = canvas.width;
const VH = canvas.height;
const GROUND_Y = 470;
const GRAVITY = 0.82;
const MOVE_SPEED = 4.5;
const JUMP_VELOCITY = -15.2;
const DOUBLE_JUMP_VELOCITY = -13.4;

const C_BLACK = '#111111';
const C_GREY = '#b6b6b6';
const C_RED = '#f31900';
const C_WHITE = '#fcfcfc';
const C_PURPLE = '#7c3aed';
const C_FOIL = '#c9c9c9';
const C_ACID = '#76ff00';
const C_YELLOW = '#ffe500';

const WORLD2_COMPLETE_KEY = 'reddersQuestWorld2Complete';
const WORLD3_UNLOCK_KEY = 'reddersQuestWorld3Unlocked';
const WORLD3_COMPLETE_KEY = 'reddersQuestWorld3Complete';
const WORLD3_BEST_TIME_KEY = 'reddersQuestWorld3BestTime';

if (localStorage.getItem(WORLD2_COMPLETE_KEY) === 'true') {
  localStorage.setItem(WORLD3_UNLOCK_KEY, 'true');
}
if (localStorage.getItem(WORLD3_UNLOCK_KEY) !== 'true') {
  window.location.replace('index.html?locked=world3');
}

const tinfoilSprite = new Image();
tinfoilSprite.src = 'tinfoil-man.png';

let keys = {};
let previousKeys = {};
window.addEventListener('keydown', event => {
  const k = event.key.toLowerCase();
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowleft', 'arrowright'].includes(k)) event.preventDefault();
  if (k === 'enter') handleEnter();
  if (k === 'r') restartFight();
  if (k === 'l' || k === 'escape') window.location.href = 'index.html';
});
window.addEventListener('keyup', event => { keys[event.key.toLowerCase()] = false; });

function justPressed(key) {
  return !!keys[key] && !previousKeys[key];
}
function rectsCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

function drawRedder(c, x, y, w, h, facing, walkPhase, hurt) {
  c.save();
  c.translate(x + w / 2, y + h / 2);
  c.scale(facing, 1);
  c.translate(-w / 2, -h / 2);
  const bob = Math.sin(walkPhase) * 2;

  c.fillStyle = C_GREY;
  c.beginPath(); c.ellipse(w * .28, h - 4, 8, 5, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(w * .72, h - 4, 8, 5, 0, 0, Math.PI * 2); c.fill();

  c.fillStyle = hurt ? C_WHITE : C_RED;
  c.beginPath();
  c.moveTo(w * .30, h * .55); c.lineTo(w * .70, h * .55);
  c.lineTo(w * .62, h - 6); c.lineTo(w * .38, h - 6); c.closePath(); c.fill();
  c.strokeStyle = C_BLACK; c.lineWidth = 1.5; c.stroke();

  c.fillStyle = C_GREY;
  c.beginPath(); c.ellipse(w * .14, h * .62 + bob * .3, 7, 6, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(w * .86, h * .62 - bob * .3, 7, 6, 0, 0, Math.PI * 2); c.fill();

  c.fillStyle = C_WHITE;
  c.beginPath(); c.ellipse(w * .5, h * .32, w * .34, h * .30, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = C_BLACK; c.lineWidth = 1.5; c.stroke();

  c.fillStyle = C_GREY;
  c.beginPath();
  c.moveTo(w * .18, h * .22); c.lineTo(w * .22, h * -.05); c.lineTo(w * .32, h * .12);
  c.lineTo(w * .40, h * -.12); c.lineTo(w * .50, h * .08); c.lineTo(w * .60, h * -.10);
  c.lineTo(w * .68, h * .10); c.lineTo(w * .80, h * -.02); c.lineTo(w * .82, h * .20);
  c.closePath(); c.fill(); c.stroke();

  c.strokeStyle = C_BLACK; c.lineWidth = 1.4;
  c.beginPath(); c.arc(w * .40, h * .30, 4, Math.PI, 0); c.stroke();
  c.beginPath(); c.arc(w * .60, h * .30, 4, Math.PI, 0); c.stroke();
  c.fillStyle = C_RED;
  c.beginPath(); c.arc(w * .40, h * .33, 1.6, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(w * .60, h * .33, 1.6, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(w * .5, h * .38, 6, .15 * Math.PI, .85 * Math.PI); c.stroke();
  c.restore();
}

let playerShots = [];
let bossShots = [];
let particles = [];
let state = 'menu';
let player;
let boss;
let fightFrames = 0;
let victoryDelay = 0;
let screenShake = 0;

class Player {
  constructor() {
    this.x = 100;
    this.y = GROUND_Y - 48;
    this.w = 38;
    this.h = 48;
    this.vx = 0;
    this.vy = 0;
    this.onGround = true;
    this.facing = 1;
    this.walkPhase = 0;
    this.maxHp = 5;
    this.hp = this.maxHp;
    this.invuln = 0;
    this.shotCooldown = 0;
    this.hasDoubleJumped = false;
  }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  update() {
    const left = keys['a'] || keys['arrowleft'];
    const right = keys['d'] || keys['arrowright'];
    const jump = justPressed('w') || justPressed(' ') || justPressed('arrowup');

    if (left && !right) { this.vx = -MOVE_SPEED; this.facing = -1; }
    else if (right && !left) { this.vx = MOVE_SPEED; this.facing = 1; }
    else this.vx *= .68;

    if (jump) {
      if (this.onGround) {
        this.vy = JUMP_VELOCITY;
        this.onGround = false;
        this.hasDoubleJumped = false;
      } else if (!this.hasDoubleJumped) {
        this.vy = DOUBLE_JUMP_VELOCITY;
        this.hasDoubleJumped = true;
        spawnBurst(this.x + this.w / 2, this.y + this.h, C_PURPLE, 10, 3.6);
      }
    }
    if ((keys['j'] || keys['z']) && this.shotCooldown <= 0) this.shoot();

    this.vy += GRAVITY;
    this.x += this.vx;
    this.y += this.vy;
    this.x = clamp(this.x, 24, VW - 24 - this.w);

    if (this.y + this.h >= GROUND_Y) {
      this.y = GROUND_Y - this.h;
      this.vy = 0;
      this.onGround = true;
      this.hasDoubleJumped = false;
    }
    if (Math.abs(this.vx) > .4) this.walkPhase += .25;
    if (this.invuln > 0) this.invuln--;
    if (this.shotCooldown > 0) this.shotCooldown--;
  }
  shoot() {
    this.shotCooldown = 15;
    const x = this.facing === 1 ? this.x + this.w + 2 : this.x - 12;
    playerShots.push(new PlayerShot(x, this.y + 20, this.facing));
    spawnBurst(x, this.y + 23, C_RED, 4, 2.7);
  }
  hurt(fromX) {
    if (this.invuln > 0 || state !== 'playing') return;
    this.hp--;
    this.invuln = 78;
    this.vy = -9;
    this.vx = this.x + this.w / 2 < fromX ? -7 : 7;
    screenShake = 12;
    spawnBurst(this.x + this.w / 2, this.y + this.h / 2, C_RED, 18, 5.5);
    if (this.hp <= 0) state = 'gameOver';
  }
  draw(c) {
    if (this.invuln > 0 && Math.floor(this.invuln / 4) % 2 === 0) return;
    drawRedder(c, this.x, this.y, this.w, this.h, this.facing, this.walkPhase, this.invuln > 0);
  }
}

class PlayerShot {
  constructor(x, y, direction) {
    this.x = x; this.y = y;
    this.w = 13; this.h = 8;
    this.vx = direction * 10;
    this.alive = true;
    this.life = 95;
  }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  update() {
    this.x += this.vx;
    this.life--;
    if (this.life <= 0 || this.x < -30 || this.x > VW + 30) this.alive = false;
  }
  draw(c) {
    const grad = c.createLinearGradient(this.x, 0, this.x + this.w, 0);
    grad.addColorStop(0, '#ffd0c8'); grad.addColorStop(.45, C_RED); grad.addColorStop(1, '#7b0900');
    c.fillStyle = grad;
    c.beginPath(); c.ellipse(this.x + this.w / 2, this.y + this.h / 2, 10, 5, 0, 0, Math.PI * 2); c.fill();
  }
}

class BossShot {
  constructor(x, y, vx, vy, type = 'orb') {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.type = type;
    this.alive = true;
    this.life = type === 'wave' ? 150 : 190;
    this.w = type === 'wave' ? 42 : 20;
    this.h = type === 'wave' ? 18 : 20;
    this.spin = 0;
  }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.type === 'orb') this.vy += .035;
    this.spin += .22;
    this.life--;
    if (this.life <= 0 || this.x < -80 || this.x > VW + 80 || this.y > VH + 50) this.alive = false;
  }
  draw(c) {
    if (this.type === 'wave') {
      c.fillStyle = 'rgba(118,255,0,.22)';
      c.fillRect(this.x - 7, this.y - 7, this.w + 14, this.h + 14);
      c.fillStyle = C_ACID;
      c.beginPath();
      c.moveTo(this.x, this.y + this.h);
      c.lineTo(this.x + this.w * .22, this.y + 3);
      c.lineTo(this.x + this.w * .5, this.y + this.h);
      c.lineTo(this.x + this.w * .78, this.y);
      c.lineTo(this.x + this.w, this.y + this.h);
      c.closePath(); c.fill();
      return;
    }
    c.save();
    c.translate(this.x + 10, this.y + 10);
    c.rotate(this.spin);
    c.fillStyle = C_FOIL;
    c.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      const r = i % 2 === 0 ? 12 : 8;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.closePath(); c.fill();
    c.strokeStyle = C_ACID; c.lineWidth = 2; c.stroke();
    c.restore();
  }
}

class TinfoilMan {
  constructor() {
    this.x = 735;
    this.y = GROUND_Y - 166;
    this.w = 116;
    this.h = 166;
    this.vx = 0;
    this.vy = 0;
    this.onGround = true;
    this.maxHp = 30;
    this.hp = this.maxHp;
    this.hurtTimer = 0;
    this.state = 'normal';
    this.stateTimer = 0;
    this.shootTimer = 80;
    this.chargeTimer = 230;
    this.jumpTimer = 160;
    this.facing = -1;
    this.dead = false;
    this.phase = 1;
    this.justLanded = false;
  }
  rect() {
    return { x: this.x + 12, y: this.y + 8, w: this.w - 24, h: this.h - 8 };
  }
  update() {
    if (this.dead) return;
    this.phase = this.hp <= this.maxHp / 2 ? 2 : 1;
    if (this.hurtTimer > 0) this.hurtTimer--;
    this.facing = player.x < this.x ? -1 : 1;

    if (this.state === 'normal') {
      const targetDirection = player.x + player.w / 2 < this.x + this.w / 2 ? -1 : 1;
      const speed = this.phase === 2 ? 1.85 : 1.25;
      this.vx = targetDirection * speed;

      this.shootTimer--;
      this.chargeTimer--;
      this.jumpTimer--;

      if (this.shootTimer <= 0) {
        this.fireAtPlayer();
        this.shootTimer = this.phase === 2 ? 56 : 86;
      }
      if (this.jumpTimer <= 0 && this.onGround) {
        this.vy = this.phase === 2 ? -14.5 : -12.5;
        this.onGround = false;
        this.jumpTimer = this.phase === 2 ? 150 : 205;
      }
      if (this.chargeTimer <= 0 && this.onGround) {
        this.state = 'windup';
        this.stateTimer = this.phase === 2 ? 28 : 42;
        this.vx = 0;
      }
    } else if (this.state === 'windup') {
      this.vx = 0;
      this.stateTimer--;
      if (this.stateTimer <= 0) {
        this.state = 'charge';
        this.stateTimer = 68;
        const direction = player.x < this.x ? -1 : 1;
        this.vx = direction * (this.phase === 2 ? 12 : 9.5);
      }
    } else if (this.state === 'charge') {
      this.stateTimer--;
      if (this.x <= 24 || this.x + this.w >= VW - 24 || this.stateTimer <= 0) {
        this.x = clamp(this.x, 24, VW - 24 - this.w);
        this.state = 'recover';
        this.stateTimer = this.phase === 2 ? 24 : 38;
        this.vx = 0;
        screenShake = 7;
        spawnBurst(this.x + this.w / 2, GROUND_Y - 8, C_FOIL, 18, 5);
      }
    } else if (this.state === 'recover') {
      this.vx = 0;
      this.stateTimer--;
      if (this.stateTimer <= 0) {
        this.state = 'normal';
        this.chargeTimer = this.phase === 2 ? 155 : 225;
      }
    }

    this.x += this.vx;
    this.x = clamp(this.x, 24, VW - 24 - this.w);

    const wasOnGround = this.onGround;
    this.vy += GRAVITY;
    this.y += this.vy;
    this.onGround = false;
    if (this.y + this.h >= GROUND_Y) {
      this.y = GROUND_Y - this.h;
      if (!wasOnGround && this.vy > 4) {
        this.landAttack();
      }
      this.vy = 0;
      this.onGround = true;
    }
  }
  fireAtPlayer() {
    const sx = this.x + this.w / 2;
    const sy = this.y + 62;
    const dx = player.x + player.w / 2 - sx;
    const dy = player.y + player.h / 2 - sy;
    const length = Math.max(1, Math.hypot(dx, dy));
    const speed = this.phase === 2 ? 6.4 : 5.3;
    bossShots.push(new BossShot(sx, sy, dx / length * speed, dy / length * speed));
    if (this.phase === 2) {
      bossShots.push(new BossShot(sx, sy, dx / length * speed, dy / length * speed - 1.4));
    }
  }
  landAttack() {
    screenShake = this.phase === 2 ? 14 : 9;
    spawnBurst(this.x + this.w / 2, GROUND_Y - 6, C_ACID, this.phase === 2 ? 28 : 18, 6.5);
    bossShots.push(new BossShot(this.x + 8, GROUND_Y - 18, -6.5, 0, 'wave'));
    bossShots.push(new BossShot(this.x + this.w - 50, GROUND_Y - 18, 6.5, 0, 'wave'));
  }
  damage(amount) {
    if (this.dead || this.hurtTimer > 0) return false;
    this.hp = Math.max(0, this.hp - amount);
    this.hurtTimer = amount >= 3 ? 12 : 4;
    screenShake = Math.max(screenShake, amount >= 3 ? 9 : 4);
    spawnBurst(this.x + this.w / 2, this.y + this.h / 2, C_ACID, amount >= 3 ? 14 : 7, 4.2);
    if (this.hp <= 0) {
      this.dead = true;
      this.vx = 0;
      bossShots = [];
      victoryDelay = 85;
      spawnBurst(this.x + this.w / 2, this.y + this.h / 2, C_FOIL, 60, 9);
      spawnBurst(this.x + this.w / 2, this.y + this.h / 2, C_YELLOW, 35, 8);
    }
    return true;
  }
  draw(c) {
    if (this.dead && victoryDelay < 60) return;
    c.save();
    if (this.state === 'windup') {
      const pulse = .25 + Math.sin(performance.now() / 65) * .12;
      c.shadowColor = C_ACID;
      c.shadowBlur = 24;
      c.fillStyle = `rgba(118,255,0,${pulse})`;
      c.fillRect(this.x - 8, this.y - 8, this.w + 16, this.h + 16);
    }
    if (this.hurtTimer > 0 && Math.floor(this.hurtTimer / 2) % 2 === 0) c.globalAlpha = .35;
    if (tinfoilSprite.complete && tinfoilSprite.naturalWidth > 0) {
      c.drawImage(tinfoilSprite, this.x, this.y, this.w, this.h);
    } else {
      c.fillStyle = C_FOIL;
      c.fillRect(this.x, this.y, this.w, this.h);
      c.fillStyle = C_YELLOW;
      c.fillRect(this.x + 28, this.y + 55, this.w - 56, this.h - 55);
      c.fillStyle = C_ACID;
      c.fillRect(this.x + 28, this.y + 30, 18, 18);
      c.fillRect(this.x + this.w - 46, this.y + 30, 18, 18);
    }
    c.restore();
  }
}

function spawnBurst(x, y, color, count, speed = 4) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const magnitude = Math.random() * speed;
    particles.push({
      x, y,
      vx: Math.cos(angle) * magnitude,
      vy: Math.sin(angle) * magnitude,
      life: 1,
      size: 2 + Math.random() * 4,
      color
    });
  }
}
function updateParticles() {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += .08;
    p.life -= .025;
  }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles(c) {
  for (const p of particles) {
    c.globalAlpha = Math.max(0, p.life);
    c.fillStyle = p.color;
    c.fillRect(p.x, p.y, p.size, p.size);
  }
  c.globalAlpha = 1;
}

function startFight() {
  player = new Player();
  boss = new TinfoilMan();
  playerShots = [];
  bossShots = [];
  particles = [];
  fightFrames = 0;
  victoryDelay = 0;
  screenShake = 0;
  state = 'playing';
}
function restartFight() {
  if (state !== 'menu') startFight();
}
function handleEnter() {
  if (state === 'menu' || state === 'gameOver') startFight();
  else if (state === 'victory') window.location.href = 'index.html';
}
function saveWorld3Clear() {
  const elapsedMs = Math.round(fightFrames / 60 * 1000);
  localStorage.setItem(WORLD3_COMPLETE_KEY, 'true');
  const oldBest = Number(localStorage.getItem(WORLD3_BEST_TIME_KEY) || 0);
  if (!oldBest || elapsedMs < oldBest) localStorage.setItem(WORLD3_BEST_TIME_KEY, String(elapsedMs));
}

function update() {
  if (state === 'playing') {
    fightFrames++;
    player.update();
    boss.update();

    for (const shot of playerShots) shot.update();
    for (const shot of bossShots) shot.update();

    for (const shot of playerShots) {
      if (shot.alive && !boss.dead && rectsCollide(shot.rect(), boss.rect())) {
        if (boss.damage(1)) shot.alive = false;
      }
    }

    for (const shot of bossShots) {
      if (shot.alive && rectsCollide(shot.rect(), player.rect())) {
        shot.alive = false;
        player.hurt(shot.x + shot.w / 2);
      }
    }

    if (!boss.dead && rectsCollide(player.rect(), boss.rect())) {
      const previousBottom = player.y + player.h - player.vy;
      const stomping = player.vy > 1.5 && previousBottom <= boss.y + 30;
      if (stomping) {
        boss.damage(3);
        player.y = boss.y - player.h + 3;
        player.vy = -12;
        player.onGround = false;
      } else {
        player.hurt(boss.x + boss.w / 2);
      }
    }

    playerShots = playerShots.filter(shot => shot.alive);
    bossShots = bossShots.filter(shot => shot.alive);

    if (boss.dead) {
      victoryDelay--;
      if (victoryDelay <= 0) {
        saveWorld3Clear();
        state = 'victory';
      }
    }
  }

  updateParticles();
  if (screenShake > 0) screenShake--;
  previousKeys = { ...keys };
}

function drawArenaBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, VH);
  grad.addColorStop(0, '#08090d');
  grad.addColorStop(.72, '#24272d');
  grad.addColorStop(1, '#0e0f13');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VW, VH);

  ctx.strokeStyle = 'rgba(220,220,220,.12)';
  ctx.lineWidth = 2;
  for (let x = 0; x < VW; x += 96) {
    ctx.strokeRect(x, 70, 96, 330);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    ctx.beginPath(); ctx.arc(x + 10, 82, 3, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = 'rgba(118,255,0,.08)';
  for (let i = 0; i < 7; i++) {
    const y = 110 + i * 42;
    ctx.fillRect(0, y, VW, 2);
  }

  ctx.fillStyle = '#15171c';
  ctx.fillRect(0, GROUND_Y, VW, VH - GROUND_Y);
  ctx.fillStyle = '#aeb0b4';
  ctx.fillRect(0, GROUND_Y, VW, 7);
  ctx.fillStyle = C_YELLOW;
  for (let x = -30; x < VW + 50; x += 70) {
    ctx.save();
    ctx.translate(x, GROUND_Y + 22);
    ctx.rotate(-.55);
    ctx.fillRect(0, 0, 38, 10);
    ctx.restore();
  }
}

function drawHUD() {
  ctx.textAlign = 'left';
  ctx.fillStyle = '#f6f6f6';
  ctx.font = 'bold 13px "Segoe UI"';
  ctx.fillText('REDDER', 22, 24);
  for (let i = 0; i < player.maxHp; i++) {
    const x = 22 + i * 30;
    ctx.fillStyle = i < player.hp ? C_RED : '#3b3c42';
    ctx.beginPath();
    ctx.arc(x + 7, 42, 7, 0, Math.PI * 2);
    ctx.arc(x + 17, 42, 7, 0, Math.PI * 2);
    ctx.lineTo(x + 12, 57);
    ctx.closePath();
    ctx.fill();
  }

  const barW = 430;
  const barX = VW / 2 - barW / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = C_FOIL;
  ctx.font = '900 16px "Segoe UI"';
  ctx.fillText(boss.phase === 2 ? 'TINFOIL MAN — MELTDOWN PHASE' : 'TINFOIL MAN', VW / 2, 24);
  ctx.fillStyle = '#15161a';
  ctx.fillRect(barX, 34, barW, 20);
  ctx.fillStyle = boss.phase === 2 ? C_ACID : C_YELLOW;
  ctx.fillRect(barX + 3, 37, (barW - 6) * (boss.hp / boss.maxHp), 14);
  ctx.strokeStyle = C_FOIL;
  ctx.lineWidth = 2;
  ctx.strokeRect(barX, 34, barW, 20);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#d7d7db';
  ctx.font = 'bold 13px "Segoe UI"';
  ctx.fillText(`${(fightFrames / 60).toFixed(1)}s`, VW - 22, 24);
  ctx.textAlign = 'left';
}

function drawMenu() {
  drawArenaBackground();
  ctx.textAlign = 'center';
  ctx.fillStyle = C_FOIL;
  ctx.font = '900 18px "Segoe UI"';
  ctx.fillText('WORLD 3', VW / 2, 76);
  ctx.fillStyle = C_YELLOW;
  ctx.font = '900 42px "Segoe UI"';
  ctx.fillText('TINFOIL SHOWDOWN', VW / 2, 120);

  if (tinfoilSprite.complete && tinfoilSprite.naturalWidth > 0) {
    ctx.drawImage(tinfoilSprite, VW / 2 - 72, 145, 144, 195);
  }

  ctx.fillStyle = '#ececf0';
  ctx.font = '16px "Segoe UI"';
  ctx.fillText('Defeat Tinfoil Man to clear World 3.', VW / 2, 375);
  ctx.font = '13px "Segoe UI"';
  ctx.fillStyle = '#b8bac1';
  ctx.fillText('Press J to fire. Stomping his head deals heavy damage.', VW / 2, 402);
  ctx.fillText('Dodge foil shots, charges, and ground shockwaves.', VW / 2, 425);
  ctx.fillStyle = C_ACID;
  ctx.font = '900 18px "Segoe UI"';
  ctx.fillText('PRESS ENTER TO FIGHT', VW / 2, 478);
  ctx.textAlign = 'left';
}

function drawGameOver() {
  drawArenaBackground();
  ctx.textAlign = 'center';
  ctx.fillStyle = C_RED;
  ctx.font = '900 42px "Segoe UI"';
  ctx.fillText('REDDER WAS DEFEATED', VW / 2, 220);
  ctx.fillStyle = '#f1f1f3';
  ctx.font = '16px "Segoe UI"';
  ctx.fillText('Press Enter or R to challenge Tinfoil Man again.', VW / 2, 270);
  ctx.fillStyle = C_FOIL;
  ctx.font = 'bold 14px "Segoe UI"';
  ctx.fillText('L / Esc returns to the World Lobby', VW / 2, 300);
  ctx.textAlign = 'left';
}

function drawVictory() {
  drawArenaBackground();
  ctx.textAlign = 'center';
  ctx.fillStyle = C_ACID;
  ctx.font = '900 44px "Segoe UI"';
  ctx.fillText('TINFOIL MAN DEFEATED!', VW / 2, 195);
  ctx.fillStyle = '#f5f5f6';
  ctx.font = '18px "Segoe UI"';
  ctx.fillText(`Clear time: ${(fightFrames / 60).toFixed(1)} seconds`, VW / 2, 242);
  ctx.fillStyle = C_YELLOW;
  ctx.font = '900 18px "Segoe UI"';
  ctx.fillText('WORLD 3 COMPLETE', VW / 2, 286);
  ctx.fillStyle = C_FOIL;
  ctx.font = 'bold 15px "Segoe UI"';
  ctx.fillText('PRESS ENTER FOR THE WORLD LOBBY', VW / 2, 348);
  ctx.textAlign = 'left';
}

function draw() {
  ctx.clearRect(0, 0, VW, VH);
  if (state === 'menu') { drawMenu(); return; }
  if (state === 'gameOver') { drawGameOver(); return; }
  if (state === 'victory') { drawVictory(); return; }

  const shakeX = screenShake > 0 ? (Math.random() - .5) * screenShake : 0;
  const shakeY = screenShake > 0 ? (Math.random() - .5) * screenShake * .55 : 0;
  ctx.save();
  ctx.translate(shakeX, shakeY);
  drawArenaBackground();
  boss.draw(ctx);
  player.draw(ctx);
  for (const shot of playerShots) shot.draw(ctx);
  for (const shot of bossShots) shot.draw(ctx);
  drawParticles(ctx);
  ctx.restore();

  drawHUD();
  if (boss.phase === 2 && boss.hp > 0 && boss.hp >= boss.maxHp / 2 - 1) {
    ctx.textAlign = 'center';
    ctx.fillStyle = C_ACID;
    ctx.font = '900 18px "Segoe UI"';
    ctx.fillText('TINFOIL MAN IS GOING ALL OUT!', VW / 2, 88);
    ctx.textAlign = 'left';
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
